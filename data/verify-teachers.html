<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="pragma" content="no-cache" />
<title>Edura — מורים מחפשי עבודה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Heebo', system-ui, sans-serif; margin: 0; background: #f9f7f3; color: #1a1a1a; }
  header { padding: 24px 32px; background: #fff; border-bottom: 1px solid #e5e0d6; position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0 0 8px; font-size: 20px; }
  header .meta { font-size: 13px; color: #666; }
  header .stats { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
  header .stats span { background: #f1ede4; padding: 4px 10px; border-radius: 999px; }
  .filters { padding: 16px 32px; background: #fff; border-bottom: 1px solid #e5e0d6; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 13px; }
  .filters input { flex: 1; min-width: 200px; }
  .filters .count { margin-right: auto; font-weight: 700; color: #b8860b; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th { background: #f1ede4; padding: 12px 8px; text-align: right; font-weight: 700; border-bottom: 2px solid #d4cdb8; position: sticky; top: 90px; cursor: pointer; user-select: none; }
  th:hover { background: #e8e2d2; }
  td { padding: 10px 8px; border-bottom: 1px solid #ece9df; vertical-align: top; }
  tr:hover { background: #fcfaf4; }
  .src-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; background: #e8f5e9; color: #1b5e20; }
  .region-badge { background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
  .level-badge { background: #f3e8ff; color: #6b21a8; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
  td a { color: #0066cc; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .nowrap { white-space: nowrap; }
  .empty { padding: 60px 32px; text-align: center; color: #999; }
  .nav-link { display: inline-block; margin-right: 16px; padding: 6px 14px; background: #e3f2fd; color: #0d47a1; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none; }
  .nav-link:hover { background: #bbdefb; }
</style>
</head>
<body>

<header>
  <h1>
    Edura — מורים מחפשי עבודה
    <a class="nav-link" href="verify.html">← חזרה למשרות</a>
    <a class="nav-link" href="../index.html">← לדף הראשי</a>
  </h1>
  <div class="meta">35 מורים מחפשי עבודה מארגון המורים — עם מייל, טלפון, אזור ומקצוע. למנהלים שמחפשים מורים.</div>
  <div class="stats" id="stats">טוען…</div>
</header>

<div class="filters">
  <input id="q" placeholder="חיפוש: שם, מקצוע, עיר…" />
  <select id="region">
    <option value="">אזור: הכל</option>
  </select>
  <select id="subject">
    <option value="">מקצוע: הכל</option>
  </select>
  <select id="scope">
    <option value="">היקף: הכל</option>
  </select>
  <span class="count" id="count">…</span>
</div>

<table>
  <thead>
    <tr>
      <th data-sort="date_iso">תאריך</th>
      <th data-sort="name">שם המורה</th>
      <th data-sort="subject">מקצוע</th>
      <th data-sort="level">שכבה</th>
      <th data-sort="region">אזור</th>
      <th data-sort="city">עיר</th>
      <th data-sort="scope">היקף</th>
      <th>מייל</th>
      <th>טלפון</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
let allT = [];
let filtered = [];
let sortBy = 'date_iso';
let sortDir = 'desc';

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const tbody = document.getElementById('tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">אין תוצאות</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(t => `
    <tr>
      <td class="nowrap">${escapeHtml(t.date || '')}</td>
      <td><strong>${escapeHtml(t.name || '—')}</strong></td>
      <td>${escapeHtml(t.subject || '—')}</td>
      <td>${t.level ? `<span class="level-badge">${escapeHtml(t.level)}</span>` : '—'}</td>
      <td>${t.region ? `<span class="region-badge">${escapeHtml(t.region)}</span>` : '—'}</td>
      <td>${escapeHtml(t.city || '—')}</td>
      <td>${escapeHtml(t.scope || '—')}</td>
      <td>${t.email ? `<a href="mailto:${escapeHtml(t.email)}">${escapeHtml(t.email)}</a>` : '—'}</td>
      <td class="nowrap">${t.phone ? `<a href="tel:${escapeHtml(t.phone)}">${escapeHtml(t.phone)}</a>` : '—'}</td>
    </tr>
  `).join('');
}

function applyFilters() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const region = document.getElementById('region').value;
  const subject = document.getElementById('subject').value;
  const scope = document.getElementById('scope').value;

  filtered = allT.filter(t => {
    if (region && t.region !== region) return false;
    if (subject && t.subject !== subject) return false;
    if (scope && !(t.scope || '').includes(scope)) return false;
    if (q) {
      const hay = [t.name, t.subject, t.city, t.region, t.email, t.scope].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    const va = (a[sortBy] || '').toString();
    const vb = (b[sortBy] || '').toString();
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  document.getElementById('count').textContent = `${filtered.length} מ-${allT.length} מורים`;
  render();
}

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (sortBy === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortBy = col; sortDir = 'asc'; }
    applyFilters();
  });
});

['q', 'region', 'subject', 'scope'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyFilters);
  document.getElementById(id).addEventListener('change', applyFilters);
});

async function init() {
  const res = await fetch('teachers.json', { cache: 'no-store' });
  const data = await res.json();
  allT = data.teachers;

  const withEmail = allT.filter(t => t.email).length;
  const withPhone = allT.filter(t => t.phone).length;
  document.getElementById('stats').innerHTML = `
    <span>סה"כ מורים: <strong>${data.total}</strong></span>
    <span>עם מייל: <strong>${withEmail}</strong></span>
    <span>עם טלפון: <strong>${withPhone}</strong></span>
    <span>אזורים: ${Object.entries(data.by_region).map(([k,v]) => k+': '+v).join(' · ')}</span>
    <span>עודכן: ${data.updated_at}</span>
  `;

  const regions = [...new Set(allT.map(t => t.region).filter(Boolean))].sort();
  document.getElementById('region').innerHTML = '<option value="">אזור: הכל</option>' +
    regions.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
  const subjects = [...new Set(allT.map(t => t.subject).filter(Boolean))].sort();
  document.getElementById('subject').innerHTML = '<option value="">מקצוע: הכל</option>' +
    subjects.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

  applyFilters();
}

init().catch(err => {
  document.getElementById('tbody').innerHTML = `<tr><td colspan="9" class="empty">שגיאה: ${err.message}</td></tr>`;
});
</script>

</body>
</html>
