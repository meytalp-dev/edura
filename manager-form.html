<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אדורה · פרסום משרה למנהלים</title>
<meta name="description" content="פרסמו משרה במאגר אדורה וחפשו מורים — בחינם, בלי הגבלה." />
<meta property="og:title" content="אדורה · פרסום משרה למנהלים" />
<meta property="og:description" content="פרסמו משרה במאגר אדורה וחפשו מורים — בחינם, בלי הגבלה." />
<meta property="og:url" content="https://edura.co.il/manager-form.html" />
<meta property="og:site_name" content="אדורה" />
<meta property="og:locale" content="he_IL" />
<link rel="canonical" href="https://edura.co.il/manager-form.html" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-deep: #0B2A4A;
    --green-soft: #1E3A5F;
    --green-pale: #CCFBF1;
    --teal: #14B8A6;
    --teal-deep: #0D9488;
    --cream: #F8FAFC;
    --orange: #D97706;
    --orange-soft: #FEF3C7;
    --ink: #0B2A4A;
    --ink-soft: #1E3A5F;
    --ink-mute: #475569;
    --line: #E2E8F0;
    --bg: #F8FAFC;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :where(button, a, input, select, textarea, summary, [tabindex]):focus-visible {
    outline: 3px solid var(--teal-deep);
    outline-offset: 2px;
    border-radius: 6px;
  }
  body {
    font-family: 'Heebo', 'Assistant', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
  }
  .header-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo { display: flex; align-items: center; gap: 4px; transition: transform .15s; text-decoration: none; }
  .logo:hover { transform: translateY(-1px); }
  .logo-svg { height: 32px; width: auto; display: block; }
  .logo-nikud { font-family: 'Heebo', sans-serif; font-weight: 900; font-size: 36px; letter-spacing: -0.5px; fill: var(--teal); }
  .logo-word { font-family: 'Heebo', sans-serif; font-weight: 900; font-size: 36px; letter-spacing: -0.5px; fill: var(--ink); }
  .logo-h { fill: var(--teal); }
  .back-link {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  main {
    max-width: 560px;
    margin: 40px auto;
    padding: 0 24px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 36px);
    font-weight: 800;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .lead {
    color: var(--ink-soft);
    font-size: 16px;
    margin-bottom: 32px;
  }
  .coming-soon {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  .coming-soon-badge {
    display: inline-block;
    background: var(--cream);
    color: var(--green-deep);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }
  .coming-soon h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .coming-soon p {
    color: var(--ink-soft);
    margin-bottom: 24px;
  }
  .btn {
    display: inline-block;
    background: var(--green-deep);
    color: var(--white);
    padding: 12px 28px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: background .15s;
  }
  .btn:hover { background: var(--green-soft); }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo" aria-label="אדורה — לוח משרות הוראה">
      <svg class="logo-svg" viewBox="0 0 200 50" aria-hidden="true">
        <text x="100" y="38" text-anchor="middle" direction="rtl" class="logo-nikud">אֶדורֶה</text>
        <text x="100" y="38" text-anchor="middle" direction="rtl" class="logo-word">אדור<tspan class="logo-h">ה</tspan></text>
      </svg>
    </a>
    <a href="index.html" class="back-link">← חזרה לעמוד הבית</a>
  </div>
</header>

<main>
  <h1>פרסום משרה למנהלים</h1>
  <p class="lead">פרסמו משרה במאגר אדורה — בחינם, בלי הגבלה. הטופס פתוח ועובד דרך עמוד הבית.</p>

  <div class="coming-soon">
    <div class="coming-soon-badge">פעיל</div>
    <h2>הטופס נמצא בעמוד הבית</h2>
    <p>הטופס לפרסום משרה זמין בלחיצה אחת מעמוד הבית — מילוי מהיר, פרסום מיידי לכל המנהלים והמורים.</p>
    <a href="index.html#post-job" class="btn" id="open-form-btn">פתחו את טופס הפרסום</a>
  </div>
</main>

<script>
  // קישור עומק — פותח את המודאל ישירות מעמוד הבית
  document.getElementById('open-form-btn').addEventListener('click', function(e){
    e.preventDefault();
    sessionStorage.setItem('edura:open-post-job', '1');
    window.location.href = 'index.html';
  });
</script>

<script src="analytics.js"></script>
<script src="feedback-widget.js" defer></script>

</body>
</html>
