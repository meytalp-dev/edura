<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>אדורה · גרסת עיצוב חדש (Wolt-style v2)</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal: #009DE0;        /* Wolt-blue (the actual brand cyan) */
    --teal-deep: #0077B5;
    --teal-pale: #E0F4FB;
    --coral: #FF5F5F;
    --coral-pale: #FFEBEB;
    --cream: #FFF7E8;
    --sun: #FFD466;
    --ink: #0E1B2C;          /* deep navy */
    --ink-soft: #2C3D55;
    --ink-mute: #6B7B8E;
    --line: #E8EAED;
    --line-soft: #F4F5F7;
    --bg: #FFFFFF;
    --bg-2: #F7F8FA;          /* Wolt's subtle bg */
    --shadow-sm: 0 1px 2px rgba(14,27,44,.04);
    --shadow: 0 4px 12px rgba(14,27,44,.06);
    --shadow-lg: 0 12px 28px rgba(14,27,44,.10);
    --r: 12px;
    --r-md: 16px;
    --r-lg: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; }
  svg { display: block; }

  /* ───── TOP BAR ───── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--line-soft);
    padding: 12px 24px;
  }
  .topbar-inner {
    max-width: 1320px; margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center; gap: 24px;
  }
  .topbar-logo {
    font-weight: 900; font-size: 22px;
    color: var(--ink); letter-spacing: -1px;
    display: flex; align-items: center; gap: 8px;
  }
  .topbar-logo .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--teal);
  }
  .topbar-logo .tag {
    font-size: 10px; font-weight: 700; color: var(--coral);
    background: var(--coral-pale); padding: 3px 8px; border-radius: 999px;
    margin-inline-start: 4px; letter-spacing: 0.3px;
  }

  /* City picker — the "Where to?" */
  .city-picker {
    display: flex; align-items: center;
    background: var(--bg-2);
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 5px 6px 5px 5px;
    transition: border-color .15s, box-shadow .15s, background .15s;
    cursor: text;
    max-width: 540px; margin: 0 auto;
    width: 100%;
  }
  .city-picker:focus-within {
    border-color: var(--ink);
    background: var(--bg);
    box-shadow: 0 4px 14px rgba(14,27,44,.08);
  }
  .city-pin {
    background: var(--ink); color: var(--bg);
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .city-pin svg { width: 18px; height: 18px; }
  .city-input {
    flex: 1; border: none; outline: none;
    background: transparent; padding: 0 14px;
    font-size: 16px; font-weight: 500;
    color: var(--ink); font-family: inherit;
    min-width: 0;
  }
  .city-input::placeholder { color: var(--ink-mute); font-weight: 400; }
  .city-go {
    background: var(--ink); color: var(--bg);
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .15s;
  }
  .city-go:hover { background: var(--teal); }

  .topbar-nav { display: flex; gap: 2px; align-items: center; }
  .nav-link {
    padding: 9px 14px; border-radius: 8px;
    font-size: 14px; font-weight: 600; color: var(--ink-soft);
    transition: background .15s, color .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .nav-link svg { width: 16px; height: 16px; }
  .nav-link:hover { background: var(--bg-2); color: var(--ink); }
  .nav-link.primary {
    background: var(--ink); color: var(--bg);
  }
  .nav-link.primary:hover { background: var(--teal); }

  /* ───── CATEGORY CHIPS (Wolt round icons) ───── */
  .categories {
    max-width: 1320px; margin: 0 auto;
    padding: 28px 24px 4px;
  }
  .categories-scroll {
    display: flex; gap: 6px; overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
  }
  .categories-scroll::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 8px 8px 10px;
    border-radius: var(--r);
    transition: background .15s;
    min-width: 88px;
    color: var(--ink-soft);
  }
  .cat-chip:hover { background: var(--bg-2); }
  .cat-chip.active { color: var(--ink); }
  .cat-chip-icon {
    width: 64px; height: 64px;
    background: var(--bg-2); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .15s, box-shadow .15s;
  }
  .cat-chip:hover .cat-chip-icon { transform: scale(1.05); }
  .cat-chip.active .cat-chip-icon {
    background: var(--ink); color: var(--bg);
    box-shadow: 0 4px 12px rgba(14,27,44,.18);
  }
  .cat-chip-icon svg { width: 28px; height: 28px; }
  .cat-chip-label { font-size: 13px; font-weight: 600; line-height: 1.1; text-align: center; }
  .cat-chip-count {
    display: none;
  }

  /* ───── DISCOVERY ROWS ───── */
  .discovery {
    max-width: 1320px; margin: 0 auto;
    padding: 0 24px 60px;
  }
  .row { margin-top: 40px; }
  .row-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 16px;
  }
  .row-title {
    font-size: 24px; font-weight: 900; color: var(--ink);
    letter-spacing: -0.6px; margin: 0;
    display: flex; align-items: center; gap: 10px;
  }
  .row-icon {
    width: 32px; height: 32px;
    background: var(--bg-2); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .row-icon svg { width: 16px; height: 16px; }
  .row-actions { display: flex; align-items: center; gap: 8px; }
  .row-link {
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
    padding: 8px 12px; border-radius: 999px;
    transition: background .15s, color .15s;
  }
  .row-link:hover { background: var(--bg-2); color: var(--ink); }
  .row-arrow {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    transition: background .15s, color .15s;
  }
  .row-arrow:hover { background: var(--ink); color: var(--bg); }
  .row-arrow svg { width: 16px; height: 16px; }

  .row-scroll {
    display: flex; gap: 16px; overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 8px;
    scrollbar-width: none;
    scroll-behavior: smooth;
    margin: 0 -8px; padding: 0 8px 8px;
  }
  .row-scroll::-webkit-scrollbar { display: none; }

  /* ───── JOB CARD (Wolt-style restaurant card) ───── */
  .job-card {
    flex-shrink: 0;
    width: 296px;
    background: transparent;
    border-radius: var(--r-md);
    overflow: visible;
    transition: transform .2s ease;
    scroll-snap-align: start;
    cursor: pointer;
    position: relative;
    display: flex; flex-direction: column;
  }
  .job-card:hover { transform: translateY(-3px); }
  .job-card:hover .job-hero { box-shadow: var(--shadow-lg); }

  .job-hero {
    height: 178px;
    border-radius: var(--r-md);
    position: relative;
    overflow: hidden;
    transition: box-shadow .2s ease;
    background: var(--bg-2);
  }
  /* Hero illustration container */
  .job-hero-art {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .job-hero-art svg { width: 100%; height: 100%; display: block; }

  .job-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(14,27,44,.45) 100%);
    pointer-events: none;
  }
  .job-hero-city {
    position: absolute; bottom: 14px; right: 16px; left: 16px;
    color: #fff; z-index: 2;
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .job-hero-city-name {
    font-size: 24px; font-weight: 900; letter-spacing: -0.6px;
    line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  .job-hero-city-region {
    font-size: 11px; font-weight: 700; opacity: .92;
    text-transform: uppercase; letter-spacing: 0.6px;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  /* Heart save button */
  .job-save {
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,.95);
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
    backdrop-filter: blur(6px);
    transition: transform .15s, background .15s;
    box-shadow: var(--shadow-sm);
  }
  .job-save:hover { transform: scale(1.08); background: #fff; }
  .job-save svg { width: 18px; height: 18px; color: var(--ink-soft); transition: color .2s, fill .2s; }
  .job-save.saved svg { fill: var(--coral); color: var(--coral); }

  /* Badge top-left */
  .job-badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,.95);
    color: var(--ink);
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    font-size: 11px; font-weight: 800;
    box-shadow: var(--shadow-sm);
    display: inline-flex; align-items: center; gap: 4px;
    z-index: 3;
    backdrop-filter: blur(6px);
  }
  .job-badge svg { width: 12px; height: 12px; }
  .job-badge.hot { background: var(--coral); color: #fff; }
  .job-badge.fresh { background: var(--sun); color: var(--ink); }
  .job-badge.urgent { background: var(--ink); color: #fff; }

  .job-body {
    padding: 12px 4px 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .job-title {
    font-size: 16px; font-weight: 700; color: var(--ink);
    line-height: 1.3; letter-spacing: -0.2px;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
  }
  .job-school {
    font-size: 13px; color: var(--ink-mute); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .job-meta {
    font-size: 13px; color: var(--ink-soft); font-weight: 500;
    margin-top: 4px;
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  }
  .job-meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-mute); display: inline-block; }
  .job-meta strong { color: var(--ink); font-weight: 700; }

  /* ───── EMPTY / LOADING ───── */
  .skeleton-card {
    flex-shrink: 0; width: 296px;
  }
  .skeleton-hero {
    height: 178px; border-radius: var(--r-md);
    background: linear-gradient(90deg, #F4F5F7 25%, #E8EAED 50%, #F4F5F7 75%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite;
  }
  .skeleton-line {
    height: 12px; background: #F4F5F7; border-radius: 6px; margin-top: 10px;
  }
  .skeleton-line.w-3-4 { width: 75%; }
  .skeleton-line.w-1-2 { width: 50%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ───── FOOTER NOTE ───── */
  .v2-note {
    max-width: 1320px; margin: 60px auto 24px;
    padding: 24px;
    background: var(--bg-2); border-radius: var(--r-lg);
    text-align: center; color: var(--ink-soft);
    font-size: 13px;
  }
  .v2-note strong { color: var(--ink); }
  .v2-note .compare {
    display: inline-flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; justify-content: center;
  }
  .v2-note .compare a {
    padding: 8px 16px; border-radius: 999px;
    background: var(--bg); color: var(--ink);
    font-weight: 600; border: 1px solid var(--line);
    transition: border-color .15s;
  }
  .v2-note .compare a:hover { border-color: var(--ink); }

  /* ───── RESPONSIVE ───── */
  @media (max-width: 768px) {
    .topbar { padding: 10px 12px; }
    .topbar-inner { grid-template-columns: 1fr; gap: 10px; }
    .topbar-nav { display: none; }
    .row-title { font-size: 20px; }
    .job-card { width: 248px; }
    .job-hero { height: 150px; }
    .job-hero-city-name { font-size: 20px; }
    .categories { padding: 16px 12px 4px; }
    .cat-chip { min-width: 76px; }
    .cat-chip-icon { width: 56px; height: 56px; }
    .cat-chip-icon svg { width: 24px; height: 24px; }
    .discovery { padding: 0 12px 40px; }
  }
</style>
</head>
<body>

// Region → unique illustration palette + landmark

// SVG illustrations per region (skylines)
const SKYLINES = {

      </g>
      <circle cx="240" cy="40" r="14" fill="rgba(255,255,255,.4)"/>
    </svg>`,
  desert: `
    <svg viewBox="0 0 296 178" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;opacity:.85">
      <g fill="rgba(255,255,255,.15)">

      </g>
      <g fill="rgba(255,255,255,.25)">
        <path d="M0 178 Q 70 140, 140 160 T 296 150 L296 178 Z"/>
      </g>

    </svg>`,
  city: `
    <svg viewBox="0 0 296 178" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;opacity:.85">

        <rect x="58" y="105" width="6" height="8"/><rect x="68" y="105" width="6" height="8"/><rect x="78" y="105" width="6" height="8"/>

      </g>
      <g fill="rgba(255,255,255,.5)">
        <rect x="222" y="65" width="6" height="6"/><rect x="232" y="65" width="6" height="6"/><rect x="242" y="65" width="6" height="6"/><rect x="252" y="65" width="6" height="6"/>
        <rect x="222" y="80" width="6" height="6"/><rect x="232" y="80" width="6" height="6"/><rect x="242" y="80" width="6" height="6"/><rect x="252" y="80" width="6" height="6"/>
      </g>

  rolling: `
    <svg viewBox="0 0 296 178" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;opacity:.85">
      <g fill="rgba(255,255,255,.15)">
        <path d="M0 178 Q 60 120, 120 140 T 240 120 T 296 140 L296 178 Z"/>
      </g>
      <g fill="rgba(255,255,255,.25)">
        <path d="M0 178 Q 80 150, 160 165 T 296 155 L296 178 Z"/>
      </g>
      <g fill="rgba(255,255,255,.35)">
        <circle cx="200" cy="50" r="10"/>
        <circle cx="218" cy="50" r="10"/>
        <circle cx="210" cy="38" r="10"/>
      </g>
    </svg>`
};

let JOBS = [];

async function loadJobs() {
  try {
    const res = await fetch('data/jobs.json');
    const data = await res.json();
    JOBS = data.jobs || [];
    render();
  } catch (e) {
    console.error('Failed to load jobs', e);
    document.getElementById('row-hot').innerHTML = '<div style="padding:20px;color:#6B7B8E">לא הצלחנו לטעון משרות.</div>';
  }
}

function jobMatchesSubjectCat(job, cat) {
  if (!cat.match) return true;
  const s = (job.subject || '') + ' ' + (job.title || '') + ' ' + (job.role || '');
  return cat.match.some(m => s.includes(m));
}

function renderCategories() {
  const html = SUBJECT_CATS.map(cat => {
    const count = cat.match ? JOBS.filter(j => jobMatchesSubjectCat(j, cat)).length : JOBS.length;
    if (cat.match && count === 0) return '';
    return (
      '<button class="cat-chip' + (cat.key==='all'?' active':'') + '" data-cat="' + cat.key + '">' +
        '<div class="cat-chip-icon"><svg><use href="#' + cat.icon + '"/></svg></div>' +
        '<div class="cat-chip-label">' + cat.label + '</div>' +
      '</button>'
    );
  }).join('');

  document.getElementById('categories-scroll').innerHTML = html;

  document.querySelectorAll('.cat-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      filterByCategory(chip.dataset.cat);
    });
  });
}

function filterByCategory(catKey) {
  const cat = SUBJECT_CATS.find(c => c.key === catKey);
  const filtered = !cat || !cat.match ? JOBS : JOBS.filter(j => jobMatchesSubjectCat(j, cat));
  renderRows(filtered);
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderJobCard(job, badge) {
  const region = job.region && REGION_ART[job.region] ? job.region : 'default';
  const art = REGION_ART[region];
  const skyline = SKYLINES[art.skyline] || SKYLINES.city;
  const city = job.city || job.school || 'לא צוינה עיר';
  const title = job.title || (job.role ? job.role + (job.subject ? ' ל' + job.subject : '') : 'משרה');

  const metaParts = [];
  if (job.scope) metaParts.push('<strong>' + escapeHtml(job.scope) + '</strong>');
  if (job.level) metaParts.push(escapeHtml(job.level));
  if (job.subject) metaParts.push(escapeHtml(job.subject));
  const metaHtml = metaParts.join('<span class="job-meta-dot"></span>');

  const badgeHtml = badge
    ? '<div class="job-badge ' + badge.cls + '"><svg><use href="#' + badge.icon + '"/></svg>' + escapeHtml(badge.label) + '</div>'
    : '';

  return (
    '<article class="job-card" onclick="window.open(\'' + escapeHtml(job.url || '#') + '\',\'_blank\')">' +
      '<div class="job-hero" style="background:' + art.bg + '">' +
        '<div class="job-hero-art">' + skyline + '</div>' +
        '<div class="job-hero-overlay"></div>' +
        badgeHtml +
        '<button class="job-save" aria-label="שמור" onclick="event.stopPropagation();this.classList.toggle(\'saved\')">' +
          '<svg><use href="#i-heart"/></svg>' +
        '</button>' +
        '<div class="job-hero-city">' +
          '<div class="job-hero-city-name">' + escapeHtml(city) + '</div>' +
          '<div class="job-hero-city-region">' + escapeHtml(job.region || '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="job-body">' +
        '<div class="job-title">' + escapeHtml(title) + '</div>' +
        (job.school ? '<div class="job-school">' + escapeHtml(job.school) + '</div>' : '') +
        (metaHtml ? '<div class="job-meta">' + metaHtml + '</div>' : '') +
      '</div>' +
    '</article>'
  );
}

function renderRows(pool) {
  const today = new Date('2026-05-05');
  const sevenDaysAgo = new Date(today.getTime() - 7*24*60*60*1000);

  const sig = j => (j.school || '') + '|' + (j.subject || '') + '|' + (j.city || '');
  const groups = {};
  pool.forEach(j => { const k = sig(j); (groups[k] = groups[k] || []).push(j); });
  const hot = Object.values(groups)
    .filter(g => g.length > 1 || (g[0].region === 'מרכז' && g[0].subject))
    .sort((a,b) => b.length - a.length)
    .slice(0, 12).map(g => g[0]);

  const fresh = pool
    .filter(j => j.date_iso && new Date(j.date_iso) >= sevenDaysAgo)
    .sort((a,b) => (b.date_iso || '').localeCompare(a.date_iso || ''))
    .slice(0, 12);

  const match = pool.slice().sort(() => Math.random() - 0.5).slice(0, 12);

  document.getElementById('row-hot').innerHTML = hot.length
    ? hot.map(j => renderJobCard(j, { cls: 'hot', icon: 'i-flame', label: 'חמה' })).join('')
    : emptyRow('אין משרות חמות בקטגוריה הזו');

  document.getElementById('row-fresh').innerHTML = fresh.length
    ? fresh.map(j => renderJobCard(j, { cls: 'fresh', icon: 'i-sparkle', label: 'חדש' })).join('')
    : emptyRow('אין מודעות חדשות מהשבוע');

  document.getElementById('row-match').innerHTML = match.length
    ? match.map(j => renderJobCard(j, null)).join('')
    : emptyRow('בנה פרופיל כדי לראות התאמות');
}

function emptyRow(msg) {
  return '<div style="padding:20px 4px;color:#6B7B8E;font-size:14px">' + msg + '</div>';
}

function showSkeletons() {
  const sk = Array(5).fill('<div class="skeleton-card"><div class="skeleton-hero"></div><div class="skeleton-line w-3-4"></div><div class="skeleton-line w-1-2"></div></div>').join('');
  document.getElementById('row-hot').innerHTML = sk;
  document.getElementById('row-fresh').innerHTML = sk;
  document.getElementById('row-match').innerHTML = sk;
}

function render() {
  renderCategories();
  renderRows(JOBS);
}

// City picker
document.getElementById('city-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') filterByCity(e.target.value.trim());
});
function filterByCity(city) {
  if (!city) { renderRows(JOBS); return; }
  const filtered = JOBS.filter(j => j.city && j.city.includes(city));
  renderRows(filtered);
}

// Row arrow scroll
document.querySelectorAll('.row-arrow').forEach(btn => {
  btn.addEventListener('click', () => {
    const row = document.getElementById(btn.dataset.row);
    if (!row) return;
    const dir = btn.dataset.dir === 'next' ? -1 : 1;
    row.scrollBy({ left: dir * 320, behavior: 'smooth' });
  });
});

showSkeletons();
loadJobs();
</script>
