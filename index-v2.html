<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>אדורה · גרסת עיצוב חדש (Wolt-style v3)</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://images.unsplash.com" />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal: #009DE0;
    --teal-deep: #0077B5;
    --teal-pale: #E0F4FB;
    --coral: #FF5F5F;
    --coral-pale: #FFEBEB;
    --cream: #FFF7E8;
    --sun: #FFD466;
    --ink: #0E1B2C;
    --ink-soft: #2C3D55;
    --ink-mute: #6B7B8E;
    --line: #E8EAED;
    --line-soft: #F4F5F7;
    --bg: #FFFFFF;
    --bg-2: #F7F8FA;
    --shadow-sm: 0 1px 2px rgba(14,27,44,.04);
    --shadow: 0 4px 12px rgba(14,27,44,.06);
    --shadow-lg: 0 12px 28px rgba(14,27,44,.10);
    --r: 12px;
    --r-md: 16px;
    --r-lg: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; }
  svg { display: block; }

  /* ───── TOP BAR ───── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--line-soft);
    padding: 12px 24px;
  }
  .topbar-inner {
    max-width: 1320px; margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center; gap: 24px;
  }
  .topbar-logo {
    font-weight: 900; font-size: 22px;
    color: var(--ink); letter-spacing: -1px;
    display: flex; align-items: center; gap: 8px;
  }
  .topbar-logo .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
  .topbar-logo .tag {
    font-size: 10px; font-weight: 700; color: var(--coral);
    background: var(--coral-pale); padding: 3px 8px; border-radius: 999px;
    margin-inline-start: 4px; letter-spacing: 0.3px;
  }
  .city-picker {
    display: flex; align-items: center;
    background: var(--bg-2);
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 5px 6px 5px 5px;
    transition: border-color .15s, box-shadow .15s, background .15s;
    cursor: text;
    max-width: 540px; margin: 0 auto;
    width: 100%;
    position: relative;
  }
  .city-picker:focus-within {
    border-color: var(--ink); background: var(--bg);
    box-shadow: 0 4px 14px rgba(14,27,44,.08);
  }
  .city-pin {
    background: var(--ink); color: var(--bg);
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .city-pin svg { width: 18px; height: 18px; }
  .city-input {
    flex: 1; border: none; outline: none;
    background: transparent; padding: 0 14px;
    font-size: 16px; font-weight: 500;
    color: var(--ink); font-family: inherit;
    min-width: 0;
  }
  .city-input::placeholder { color: var(--ink-mute); font-weight: 400; }
  .city-go {
    background: var(--ink); color: var(--bg);
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .15s;
  }
  .city-go:hover { background: var(--teal); }

  /* City suggestions dropdown */
  .city-suggest {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-lg);
    max-height: 280px; overflow-y: auto;
    z-index: 200; display: none;
    padding: 6px;
  }
  .city-suggest.open { display: block; }
  .city-suggest-item {
    width: 100%; text-align: right;
    padding: 10px 14px; border-radius: 8px;
    font-size: 14px; color: var(--ink);
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: background .1s;
  }
  .city-suggest-item:hover, .city-suggest-item.active { background: var(--bg-2); }
  .city-suggest-count { font-size: 12px; color: var(--ink-mute); font-weight: 600; }

  .topbar-nav { display: flex; gap: 2px; align-items: center; }
  .nav-link {
    padding: 9px 14px; border-radius: 8px;
    font-size: 14px; font-weight: 600; color: var(--ink-soft);
    transition: background .15s, color .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .nav-link svg { width: 16px; height: 16px; }
  .nav-link:hover { background: var(--bg-2); color: var(--ink); }
  .nav-link.primary { background: var(--ink); color: var(--bg); }
  .nav-link.primary:hover { background: var(--teal); }

  /* ───── FILTERS BAR ───── */
  .filters {
    max-width: 1320px; margin: 0 auto;
    padding: 24px 24px 0;
  }
  .filter-section {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 14px;
  }
  .filter-label {
    flex-shrink: 0; min-width: 88px;
    font-size: 13px; font-weight: 700; color: var(--ink-mute);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .chips-scroll {
    display: flex; gap: 6px; overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
  }
  .chips-scroll::-webkit-scrollbar { display: none; }

  /* Subject chips (round Wolt-style) */
  .cat-chip {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 6px 8px 8px;
    border-radius: var(--r);
    transition: background .15s;
    min-width: 84px;
    color: var(--ink-soft);
  }
  .cat-chip:hover { background: var(--bg-2); }
  .cat-chip.active { color: var(--ink); }
  .cat-chip-icon {
    width: 60px; height: 60px;
    background: var(--bg-2); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .15s, box-shadow .15s, color .15s;
  }
  .cat-chip:hover .cat-chip-icon { transform: scale(1.05); }
  .cat-chip.active .cat-chip-icon {
    background: var(--ink); color: var(--bg);
    box-shadow: 0 4px 12px rgba(14,27,44,.18);
  }
  .cat-chip-icon svg { width: 26px; height: 26px; }
  .cat-chip-label { font-size: 13px; font-weight: 600; line-height: 1.1; text-align: center; }

  /* Level chips (pill style) */
  .level-chip {
    flex-shrink: 0;
    padding: 8px 16px;
    background: var(--bg-2);
    border: 1.5px solid transparent;
    border-radius: 999px;
    font-size: 13px; font-weight: 600;
    color: var(--ink-soft);
    transition: all .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .level-chip:hover { background: var(--bg); border-color: var(--line); }
  .level-chip.active {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  .level-chip-count { font-size: 11px; opacity: .7; font-weight: 700; }

  /* Active filters bar */
  .active-filters {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 24px; max-width: 1320px; margin: 0 auto;
    flex-wrap: wrap;
  }
  .active-filters-count {
    font-size: 14px; font-weight: 800; color: var(--ink);
  }
  .active-filters-count strong { color: var(--coral); }
  .active-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 8px 5px 12px;
    background: var(--ink); color: var(--bg);
    border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .active-pill button {
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(255,255,255,.2); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }
  .active-pill button:hover { background: rgba(255,255,255,.35); }
  .clear-all-btn {
    font-size: 12px; font-weight: 700; color: var(--coral);
    padding: 6px 10px; border-radius: 999px;
    transition: background .15s;
  }
  .clear-all-btn:hover { background: var(--coral-pale); }

  /* ───── DISCOVERY ROWS ───── */
  .discovery {
    max-width: 1320px; margin: 0 auto;
    padding: 0 24px 60px;
  }
  .row { margin-top: 36px; }
  .row-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 16px;
  }
  .row-title {
    font-size: 22px; font-weight: 900; color: var(--ink);
    letter-spacing: -0.5px; margin: 0;
    display: flex; align-items: center; gap: 10px;
  }
  .row-icon {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .row-icon svg { width: 16px; height: 16px; }
  .row-actions { display: flex; align-items: center; gap: 8px; }
  .row-link {
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
    padding: 8px 12px; border-radius: 999px;
    transition: background .15s, color .15s;
  }
  .row-link:hover { background: var(--bg-2); color: var(--ink); }
  .row-arrow {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    transition: background .15s, color .15s;
  }
  .row-arrow:hover { background: var(--ink); color: var(--bg); }
  .row-arrow svg { width: 16px; height: 16px; }
  .row-scroll {
    display: flex; gap: 16px; overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    scroll-behavior: smooth;
    margin: 0 -8px; padding: 0 8px 8px;
  }
  .row-scroll::-webkit-scrollbar { display: none; }

  /* ───── JOB CARD (Wolt-style) ───── */
  .job-card {
    flex-shrink: 0;
    width: 296px;
    background: transparent;
    border-radius: var(--r-md);
    transition: transform .2s ease;
    scroll-snap-align: start;
    cursor: pointer;
    position: relative;
    display: flex; flex-direction: column;
  }
  .job-card:hover { transform: translateY(-3px); }
  .job-card:hover .job-hero { box-shadow: var(--shadow-lg); }

  .job-hero {
    height: 178px;
    border-radius: var(--r-md);
    position: relative;
    overflow: hidden;
    transition: box-shadow .2s ease;
    background-color: var(--bg-2);
    background-size: cover;
    background-position: center;
  }
  .job-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%);
    pointer-events: none;
  }
  .job-hero-city {
    position: absolute; bottom: 12px; right: 14px; left: 14px;
    color: #fff; z-index: 2;
  }
  .job-hero-city-name {
    font-size: 24px; font-weight: 900; letter-spacing: -0.6px;
    line-height: 1.1; text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .job-hero-city-region {
    font-size: 11px; font-weight: 700; opacity: .95; margin-top: 2px;
    text-transform: uppercase; letter-spacing: 0.6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
  }

  .job-save {
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,.95);
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
    backdrop-filter: blur(6px);
    transition: transform .15s, background .15s;
    box-shadow: var(--shadow-sm);
  }
  .job-save:hover { transform: scale(1.08); background: #fff; }
  .job-save svg { width: 18px; height: 18px; color: var(--ink-soft); transition: color .2s, fill .2s; }
  .job-save.saved svg { fill: var(--coral); color: var(--coral); }

  .job-badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,.95); color: var(--ink);
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    font-size: 11px; font-weight: 800;
    box-shadow: var(--shadow-sm);
    display: inline-flex; align-items: center; gap: 4px;
    z-index: 3;
    backdrop-filter: blur(6px);
  }
  .job-badge svg { width: 12px; height: 12px; }
  .job-badge.hot { background: var(--coral); color: #fff; }
  .job-badge.fresh { background: var(--sun); color: var(--ink); }

  .job-body {
    padding: 12px 4px 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .job-title {
    font-size: 16px; font-weight: 700; color: var(--ink);
    line-height: 1.3; letter-spacing: -0.2px;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  }
  .job-school {
    font-size: 13px; color: var(--ink-mute); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .job-meta {
    font-size: 13px; color: var(--ink-soft); font-weight: 500;
    margin-top: 4px;
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  }
  .job-meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-mute); display: inline-block; }
  .job-meta strong { color: var(--ink); font-weight: 700; }

  /* Skeleton */
  .skeleton-card { flex-shrink: 0; width: 296px; }
  .skeleton-hero {
    height: 178px; border-radius: var(--r-md);
    background: linear-gradient(90deg, #F4F5F7 25%, #E8EAED 50%, #F4F5F7 75%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite;
  }
  .skeleton-line { height: 12px; background: #F4F5F7; border-radius: 6px; margin-top: 10px; }
  .skeleton-line.w-3-4 { width: 75%; }
  .skeleton-line.w-1-2 { width: 50%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* No results */
  .no-results {
    text-align: center; padding: 60px 20px; color: var(--ink-mute);
    background: var(--bg-2); border-radius: var(--r-lg);
    margin: 24px;
  }
  .no-results h3 { font-size: 20px; color: var(--ink); margin: 0 0 8px; }
  .no-results p { margin: 0; font-size: 14px; }

  /* Note */
  .v2-note {
    max-width: 1320px; margin: 60px auto 24px;
    padding: 24px;
    background: var(--bg-2); border-radius: var(--r-lg);
    text-align: center; color: var(--ink-soft);
    font-size: 13px;
  }
  .v2-note strong { color: var(--ink); }
  .v2-note .compare {
    display: inline-flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; justify-content: center;
  }
  .v2-note .compare a {
    padding: 8px 16px; border-radius: 999px;
    background: var(--bg); color: var(--ink);
    font-weight: 600; border: 1px solid var(--line);
  }

  @media (max-width: 768px) {
    .topbar { padding: 10px 12px; }
    .topbar-inner { grid-template-columns: 1fr; gap: 10px; }
    .topbar-nav { display: none; }
    .row-title { font-size: 19px; }
    .job-card { width: 248px; }
    .job-hero { height: 150px; }
    .job-hero-city-name { font-size: 20px; }
    .filters { padding: 16px 12px 0; }
    .filter-section { gap: 8px; flex-direction: column; align-items: stretch; }
    .filter-label { min-width: 0; padding: 0 4px; }
    .cat-chip { min-width: 76px; }
    .cat-chip-icon { width: 56px; height: 56px; }
    .cat-chip-icon svg { width: 24px; height: 24px; }
    .discovery { padding: 0 12px 40px; }
  }
</style>
</head>

<script>
// ──────────────────────────────────────────────────
// REAL Unsplash photos by region (verified by agent)
// ──────────────────────────────────────────────────
const REGION_PHOTOS = {
  'ירושלים': [
    'https://images.unsplash.com/photo-1556861321-b7a1e5b1c291?w=600&h=400&fit=crop&q=80&auto=format',
    'https://images.unsplash.com/photo-1587297069400-6cc5da81658a?w=600&h=400&fit=crop&q=80&auto=format'
  ],
  'ת"א': [
    'https://images.unsplash.com/photo-1500990702037-7620ccb6a60a?w=600&h=400&fit=crop&q=80&auto=format',
    'https://images.unsplash.com/photo-1544971587-b842c27f8e14?w=600&h=400&fit=crop&q=80&auto=format'
  ],
  'מרכז': [
    'https://images.unsplash.com/photo-1561369669-a6531d6eb336?w=600&h=400&fit=crop&q=80&auto=format',
    'https://images.unsplash.com/photo-1607277332070-e39d58864cd3?w=600&h=400&fit=crop&q=80&auto=format',
    'https://images.unsplash.com/photo-1668968644027-6bd069eae0a7?w=600&h=400&fit=crop&q=80&auto=format'
  ],
  'צפון': [
    'https://images.unsplash.com/photo-1613412984420-1300edb8219f?w=600&h=400&fit=crop&q=80&auto=format',
    'https://images.unsplash.com/photo-1570651851409-93d5add773d7?w=600&h=400&fit=crop&q=80&auto=format'
  ],
  'דרום': [
    'https://images.unsplash.com/photo-1633088926847-435cdb7e76da?w=600&h=400&fit=crop&q=80&auto=format',
    'https://images.unsplash.com/photo-1574513828599-a4fefc82fe7d?w=600&h=400&fit=crop&q=80&auto=format'
  ],
  'שפלה': [
    'https://images.unsplash.com/photo-1437252611977-07f74518abd7?w=600&h=400&fit=crop&q=80&auto=format'
  ],
  'חיפה': [
    'https://images.unsplash.com/photo-1613412984420-1300edb8219f?w=600&h=400&fit=crop&q=80&auto=format'
  ]
};
function pickPhoto(region, city) {
  const pool = REGION_PHOTOS[region] || REGION_PHOTOS['מרכז'];
  // hash by city to get a stable but varied image per city within region
  let h = 0;
  const s = city || region || '';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return pool[h % pool.length];
}

// ──────────────────────────────────────────────────
// Subject + Level definitions
// ──────────────────────────────────────────────────
const SUBJECT_CATS = [
  { key: 'all',         label: 'הכל',       icon: 'cat-all',      match: null },
  { key: 'מתמטיקה',     label: 'מתמטיקה',    icon: 'cat-math',     match: ['מתמטיקה','מתמט'] },
  { key: 'אנגלית',      label: 'אנגלית',     icon: 'cat-english',  match: ['אנגלית'] },
  { key: 'עברית',       label: 'עברית',      icon: 'cat-hebrew',   match: ['עברית','לשון'] },
  { key: 'מדעים',       label: 'מדעים',      icon: 'cat-science',  match: ['מדע','ביולוגיה','כימיה','פיזיקה'] },
  { key: 'חינוך מיוחד', label: 'חינוך מיוחד', icon: 'cat-special', match: ['חנ"מ','חינוך מיוחד','חנמ'] },
  { key: 'היסטוריה',    label: 'היסטוריה',   icon: 'cat-history',  match: ['היסטוריה','אזרחות'] },
  { key: 'מחנכת',       label: 'מחנכ/ת',     icon: 'cat-mehanech', match: ['מחנכ'] },
  { key: 'יועץ',        label: 'יועץ/ת',     icon: 'cat-counselor', match: ['יועצ','ייעוץ'] },
  { key: 'ספורט',       label: 'חנ"ג',       icon: 'cat-sport',    match: ['חנ"ג','גופני','ספורט'] },
  { key: 'אומנות',      label: 'אומנות',     icon: 'cat-art',      match: ['אומנות','ציור','מוזיקה'] },
  { key: 'תורה',        label: 'תורה ותנ"ך',  icon: 'cat-bible',    match: ['תנ"ך','תושב"ע','תורה','גמרא'] },
];

const LEVELS = [
  { key: 'all',          label: 'כל הגילאים' },
  { key: 'גן',           label: 'גן' },
  { key: 'יסודי',        label: 'יסודי' },
  { key: 'חטיבת ביניים', label: 'חט״ב' },
  { key: 'תיכון',        label: 'תיכון' },
  { key: 'חינוך מיוחד',  label: 'חנ״מ' },
];

// ──────────────────────────────────────────────────
// City normalization — match all variants of same city
// ──────────────────────────────────────────────────
function normalizeCity(s) {
  if (!s) return '';
  return String(s)
    .replace(/[״"']/g, '')
    .replace(/-/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
const CITY_ALIASES = {
  'תאא': ['תא','תל אביב','תל אביב יפו','תל אביב  יפו'],
  'תא':  ['תאא','תל אביב','תל אביב יפו'],
  'תל אביב': ['תא','תאא','תל אביב יפו','תל אביב  יפו'],
  'תל אביב יפו': ['תא','תאא','תל אביב'],
};
function citiesMatch(a, b) {
  const na = normalizeCity(a), nb = normalizeCity(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  if (na.includes(nb) || nb.includes(na)) return true;
  const aliases = CITY_ALIASES[na] || [];
  if (aliases.some(x => normalizeCity(x) === nb)) return true;
  return false;
}

// ──────────────────────────────────────────────────
// Filter state
// ──────────────────────────────────────────────────
let JOBS = [];
let STATE = { city: '', subject: 'all', level: 'all' };

async function loadJobs() {
  try {
    const res = await fetch('data/jobs.json');
    const data = await res.json();
    JOBS = data.jobs || [];
    console.log('[edura v3] loaded', JOBS.length, 'jobs');
    initUI();
  } catch (e) {
    console.error('Failed to load jobs', e);
    document.getElementById('row-hot').innerHTML = '<div style="padding:20px;color:#6B7B8E">לא הצלחנו לטעון משרות.</div>';
  }
}

function jobMatchesSubject(job, subjKey) {
  if (subjKey === 'all') return true;
  const cat = SUBJECT_CATS.find(c => c.key === subjKey);
  if (!cat || !cat.match) return true;
  const s = (job.subject || '') + ' ' + (job.title || '') + ' ' + (job.role || '');
  return cat.match.some(m => s.includes(m));
}
function jobMatchesLevel(job, lvlKey) {
  if (lvlKey === 'all') return true;
  return job.level === lvlKey;
}
function jobMatchesCity(job, city) {
  if (!city) return true;
  return citiesMatch(job.city || '', city);
}
function applyFilters() {
  return JOBS.filter(j =>
    jobMatchesCity(j, STATE.city) &&
    jobMatchesSubject(j, STATE.subject) &&
    jobMatchesLevel(j, STATE.level)
  );
}

// ──────────────────────────────────────────────────
// Render
// ──────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderSubjectChips() {
  // Count using current city+level filter to give live counts
  const ctx = JOBS.filter(j =>
    jobMatchesCity(j, STATE.city) && jobMatchesLevel(j, STATE.level)
  );
  const html = SUBJECT_CATS.map(cat => {
    const count = cat.match ? ctx.filter(j => jobMatchesSubject(j, cat.key)).length : ctx.length;
    if (cat.match && count === 0) return '';
    return (
      '<button class="cat-chip' + (STATE.subject === cat.key ? ' active' : '') + '" data-subject="' + cat.key + '">' +
        '<div class="cat-chip-icon"><svg><use href="#' + cat.icon + '"/></svg></div>' +
        '<div class="cat-chip-label">' + cat.label + '</div>' +
      '</button>'
    );
  }).join('');
  const el = document.getElementById('subject-chips');
  el.innerHTML = html;
  el.querySelectorAll('.cat-chip').forEach(c => c.addEventListener('click', () => {
    STATE.subject = c.dataset.subject;
    renderAll();
  }));
}

function renderLevelChips() {
  const ctx = JOBS.filter(j =>
    jobMatchesCity(j, STATE.city) && jobMatchesSubject(j, STATE.subject)
  );
  const html = LEVELS.map(lvl => {
    const count = lvl.key === 'all' ? ctx.length : ctx.filter(j => j.level === lvl.key).length;
    if (lvl.key !== 'all' && count === 0) return '';
    return (
      '<button class="level-chip' + (STATE.level === lvl.key ? ' active' : '') + '" data-level="' + lvl.key + '">' +
        escapeHtml(lvl.label) +
        ' <span class="level-chip-count">' + count + '</span>' +
      '</button>'
    );
  }).join('');
  const el = document.getElementById('level-chips');
  el.innerHTML = html;
  el.querySelectorAll('.level-chip').forEach(c => c.addEventListener('click', () => {
    STATE.level = c.dataset.level;
    renderAll();
  }));
}

function renderActiveFilters() {
  const filtered = applyFilters();
  const pills = [];
  if (STATE.city) pills.push({ key: 'city', label: 'עיר: ' + STATE.city });
  if (STATE.subject !== 'all') {
    const cat = SUBJECT_CATS.find(c => c.key === STATE.subject);
    pills.push({ key: 'subject', label: 'מקצוע: ' + (cat ? cat.label : STATE.subject) });
  }
  if (STATE.level !== 'all') {
    const lvl = LEVELS.find(l => l.key === STATE.level);
    pills.push({ key: 'level', label: 'שכבה: ' + (lvl ? lvl.label : STATE.level) });
  }

  const el = document.getElementById('active-filters');
  if (!pills.length) {
    el.innerHTML = '<div class="active-filters-count">' +
      '<strong>' + filtered.length + '</strong> משרות פעילות מתוך ' + JOBS.length +
    '</div>';
    return;
  }
  el.innerHTML =
    '<div class="active-filters-count"><strong>' + filtered.length + '</strong> משרות תואמות</div>' +
    pills.map(p =>
      '<span class="active-pill">' + escapeHtml(p.label) +
        '<button data-clear="' + p.key + '" aria-label="הסר">×</button>' +
      '</span>'
    ).join('') +
    '<button class="clear-all-btn" id="clear-all">נקה הכל</button>';

  el.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.clear;
    if (k === 'city') { STATE.city = ''; document.getElementById('city-input').value = ''; }
    if (k === 'subject') STATE.subject = 'all';
    if (k === 'level') STATE.level = 'all';
    renderAll();
  }));
  const clearAll = document.getElementById('clear-all');
  if (clearAll) clearAll.addEventListener('click', () => {
    STATE = { city: '', subject: 'all', level: 'all' };
    document.getElementById('city-input').value = '';
    renderAll();
  });
}

function renderJobCard(job, badge) {
  const region = (REGION_PHOTOS[job.region] || job.region) ? job.region : 'מרכז';
  const city = job.city || job.school || 'לא צוינה עיר';
  const photo = pickPhoto(job.region, city);
  const title = job.title || (job.role ? job.role + (job.subject ? ' ל' + job.subject : '') : 'משרה');

  const metaParts = [];
  if (job.scope) metaParts.push('<strong>' + escapeHtml(job.scope) + '</strong>');
  if (job.level) metaParts.push(escapeHtml(job.level));
  if (job.subject) metaParts.push(escapeHtml(job.subject));
  const metaHtml = metaParts.join('<span class="job-meta-dot"></span>');

  const badgeHtml = badge
    ? '<div class="job-badge ' + badge.cls + '"><svg><use href="#' + badge.icon + '"/></svg>' + escapeHtml(badge.label) + '</div>'
    : '';

  return (
    '<article class="job-card" onclick="window.open(\'' + escapeHtml(job.url || '#') + '\',\'_blank\')">' +
      '<div class="job-hero" style="background-image:url(\'' + photo + '\')">' +
        '<div class="job-hero-overlay"></div>' +
        badgeHtml +
        '<button class="job-save" aria-label="שמור" onclick="event.stopPropagation();this.classList.toggle(\'saved\')">' +
          '<svg><use href="#i-heart"/></svg>' +
        '</button>' +
        '<div class="job-hero-city">' +
          '<div class="job-hero-city-name">' + escapeHtml(city) + '</div>' +
          '<div class="job-hero-city-region">' + escapeHtml(job.region || '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="job-body">' +
        '<div class="job-title">' + escapeHtml(title) + '</div>' +
        (job.school ? '<div class="job-school">' + escapeHtml(job.school) + '</div>' : '') +
        (metaHtml ? '<div class="job-meta">' + metaHtml + '</div>' : '') +
      '</div>' +
    '</article>'
  );
}

function renderRows() {
  const pool = applyFilters();
  const today = new Date('2026-05-05');
  const sevenDaysAgo = new Date(today.getTime() - 7*24*60*60*1000);

  // HOT — duplicated across sources
  const sig = j => (j.school || '') + '|' + (j.subject || '') + '|' + (j.city || '');
  const groups = {};
  pool.forEach(j => { const k = sig(j); (groups[k] = groups[k] || []).push(j); });
  const hot = Object.values(groups)
    .filter(g => g.length > 1)
    .sort((a,b) => b.length - a.length)
    .slice(0, 12).map(g => g[0]);

  const fresh = pool
    .filter(j => j.date_iso && new Date(j.date_iso) >= sevenDaysAgo)
    .sort((a,b) => (b.date_iso || '').localeCompare(a.date_iso || ''))
    .slice(0, 16);

  const all = pool.slice(0, 24);

  const setRow = (id, items, badge, emptyMsg) => {
    document.getElementById(id).innerHTML = items.length
      ? items.map(j => renderJobCard(j, badge)).join('')
      : '<div style="padding:20px 4px;color:#6B7B8E;font-size:14px">' + emptyMsg + '</div>';
  };

  setRow('row-hot', hot, { cls:'hot', icon:'i-flame', label:'חמה' }, 'אין משרות חמות בסינון הנוכחי');
  setRow('row-fresh', fresh, { cls:'fresh', icon:'i-sparkle', label:'חדש' }, 'אין מודעות חדשות מהשבוע');
  setRow('row-all', all, null, 'לא נמצאו משרות');

  document.getElementById('row-all-title').textContent = pool.length > 24
    ? 'כל המשרות (' + pool.length + ' — מציג 24 ראשונות)'
    : 'כל המשרות (' + pool.length + ')';

  // hide hot/fresh sections if empty
  document.getElementById('row-hot-wrap').style.display = hot.length ? '' : 'none';
  document.getElementById('row-fresh-wrap').style.display = fresh.length ? '' : 'none';
}

function renderAll() {
  renderSubjectChips();
  renderLevelChips();
  renderActiveFilters();
  renderRows();
}

// ──────────────────────────────────────────────────
// City picker behavior
// ──────────────────────────────────────────────────
function buildCityList() {
  const counts = {};
  JOBS.forEach(j => {
    const c = (j.city || '').trim();
    if (!c) return;
    const norm = normalizeCity(c);
    if (!counts[norm]) counts[norm] = { display: c, count: 0 };
    counts[norm].count++;
  });
  return Object.values(counts).sort((a,b) => b.count - a.count);
}

let CITY_LIST = [];
const cityInput = document.getElementById('city-input');
const citySuggest = document.getElementById('city-suggest');
function showSuggestions(query) {
  const q = normalizeCity(query);
  const matches = q
    ? CITY_LIST.filter(c => normalizeCity(c.display).includes(q)).slice(0, 12)
    : CITY_LIST.slice(0, 12);
  if (!matches.length) { citySuggest.classList.remove('open'); return; }
  citySuggest.innerHTML = matches.map(c =>
    '<button class="city-suggest-item" data-city="' + escapeHtml(c.display) + '">' +
      '<span>' + escapeHtml(c.display) + '</span>' +
      '<span class="city-suggest-count">' + c.count + '</span>' +
    '</button>'
  ).join('');
  citySuggest.classList.add('open');
  citySuggest.querySelectorAll('.city-suggest-item').forEach(b => b.addEventListener('click', () => {
    cityInput.value = b.dataset.city;
    STATE.city = b.dataset.city;
    citySuggest.classList.remove('open');
    renderAll();
  }));
}
cityInput.addEventListener('focus', () => showSuggestions(cityInput.value));
cityInput.addEventListener('input', () => showSuggestions(cityInput.value));
cityInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    STATE.city = cityInput.value.trim();
    citySuggest.classList.remove('open');
    renderAll();
  }
  if (e.key === 'Escape') citySuggest.classList.remove('open');
});
document.addEventListener('click', e => {
  if (!e.target.closest('.city-picker')) citySuggest.classList.remove('open');
});
document.getElementById('city-go').addEventListener('click', () => {
  STATE.city = cityInput.value.trim();
  citySuggest.classList.remove('open');
  renderAll();
});

// Row arrows
document.querySelectorAll('.row-arrow').forEach(btn => {
  btn.addEventListener('click', () => {
    const row = document.getElementById(btn.dataset.row);
    if (!row) return;
    row.scrollBy({ left: -320, behavior: 'smooth' });
  });
});

// ──────────────────────────────────────────────────
// Init
// ──────────────────────────────────────────────────
function showSkeletons() {
  const sk = Array(5).fill('<div class="skeleton-card"><div class="skeleton-hero"></div><div class="skeleton-line w-3-4"></div><div class="skeleton-line w-1-2"></div></div>').join('');
  ['row-hot','row-fresh','row-all'].forEach(id => document.getElementById(id).innerHTML = sk);
}
function initUI() {
  CITY_LIST = buildCityList();
  renderAll();
}

showSkeletons();
loadJobs();
</script>
